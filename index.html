<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM Manipulation</title>
  </head>
  <body>
    <h1 id="heading">Original Heading</h1>
    <p id="description">Original Description</p>

    <div id="container">
      <p>Old Content</p>
    </div>

    <div id="parentDiv">
      <span>It's created to apply removeChild method</span>
    </div>

    <div id="parent">
      <p>Middle paragraph</p>
    </div>

    <div id="testContainer">
      <h2 id="testHeading">JavaScript DOM</h2>
      <p id="testPara">Learning DOM methods</p>
    </div>

    <div id="removeParent">
      <p id="removePara">I am an old Paragraph</p>
      <p id="oldPara">Simple Paragraph to apply replaceWith method</p>
      <p id="childPara">This is child Para it will be replace</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
